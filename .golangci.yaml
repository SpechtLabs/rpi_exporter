# golangci-lint configuration for rpi_exporter.
#
# golint-sl runs as a module plugin baked into ./custom-gcl (see .custom-gcl.yml).
# The prebuilt golangci-lint cannot load the plugin, so run it with
# `mise run lint`, which builds custom-gcl and runs it.
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 10m
  tests: true
  modules-download-mode: readonly

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    # Default linters
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Additional recommended linters
    - dogsled
    - copyloopvar
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - misspell
    - modernize
    - nakedret
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - whitespace
    - unconvert
    - unparam

    # golint-sl: production-ready Go patterns (error handling, observability, safety)
    # https://golint.specht-labs.de/
    - golint-sl

  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    govet:
      # fieldalignment stays on: the exporter runs on a Raspberry Pi. Test
      # tables are excluded below.
      enable-all: true
    misspell:
      locale: US
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    custom:
      golint-sl:
        type: module
        description: SpechtLabs Go linter collection for production-ready code
        original-url: github.com/spechtlabs/golint-sl

  exclusions:
    generated: lax
    rules:
      # Hold test files to a lighter bar than production code.
      - linters:
          - gosec
          - goconst
          - golint-sl
        path: _test\.go

      - linters:
          - govet
        text: "^fieldalignment:"
        path: _test\.go

      # The collectors read sysfs and run vcgencmd, and their errors end up
      # as rpi_scrape_collector_success 0 and a log line that names the
      # collector; nobody acts on advice there. The os and strconv errors
      # they return already name the file or the value that failed.
      - linters:
          - golint-sl
        text: "^(humaneerror|errorwrap):"
        path: ^collector/(cpu|fan|gpu|textfile)\.go$

      # The files they read are sysfs paths under fixed globs, and the
      # command is the vcgencmd binary the operator names with --vcgencmd.
      - linters:
          - gosec
        text: "^G(304|204):"
        path: ^collector/(cpu|fan|gpu|textfile)\.go$

      # rpi_exporter logs with logrus, as the upstream it was forked from
      # does; moving to structured wide events is a change of its own. The
      # scrape duration is measured with the wall clock on purpose.
      - linters:
          - golint-sl
        text: "^(wideevents|clockinterface):"
        path: ^(rpi_exporter\.go|collector/)

      # textfile.go is node_exporter's textfile collector, kept close to that
      # code so fixes there carry over. The parser it calls never returns a
      # nil family or a metric type the switch doesn't handle.
      - linters:
          - golint-sl
        text: "^(functionsize|nestingdepth|nilcheck|nopanic):"
        path: ^collector/textfile\.go$

      # RegisterFlags takes the application main parses, and registerCollector
      # is only called by RegisterFlags; returning quietly on nil would hide a
      # bug rather than prevent one. isDefaultEnabled is true for every
      # collector today, and keeps the help text right for one that ships
      # disabled.
      - linters:
          - golint-sl
        text: "^nilcheck:"
        path: ^collector/collector\.go$
      - linters:
          - unparam
        text: "isDefaultEnabled"
        path: ^collector/collector\.go$

      # http.Server's ListenAndServe and Shutdown are meant to be called from
      # different goroutines, and the handler's unfilteredHandler is written
      # once, before the server starts; only the filtered handler cache is
      # shared, and it holds the mutex.
      - linters:
          - golint-sl
        text: "^syncaccess:"
        path: ^rpi_exporter\.go$

      # The 400 answer to an unknown collect[] value repeats that value, as
      # text/plain with nosniff, so a browser shows it rather than render it.
      - linters:
          - gosec
        text: "^G705:"
        path: ^rpi_exporter\.go$

    paths:
      - third_party$
      - builtin$

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
