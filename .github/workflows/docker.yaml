name: Docker

# The container image, ghcr.io/spechtlabs/rpi_exporter. ci.yaml builds it for
# pull requests without pushing; release.yaml pushes it, as `main` for every
# push to main, and as the release's tag and `latest` when release-please cut
# a release.
#
# No permissions are set here: a called workflow can only lower its caller's,
# and the publishing job in release.yaml grants packages: write.
on:
  workflow_call:
    inputs:
      push:
        description: Push the image to ghcr.io
        type: boolean
        default: false
      ref:
        description: The ref to build, by default the commit that triggered the run
        type: string
        default: ""
      version:
        description: A release tag to publish the image as (e.g. v1.0.11)
        type: string
        default: ""
      latest:
        description: Also tag the image `latest`
        type: boolean
        default: false
  workflow_dispatch:

jobs:
  build:
    name: Build${{ inputs.push && ' and push' || '' }} the image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      # The Dockerfile cross-compiles in a builder on the runner's platform,
      # and the final stage only copies the binary, so nothing runs under
      # QEMU emulation.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `main` for a push to main, and the release tag plus `latest` for a
      # release, as the images published so far are tagged.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.latest }}

      - name: Build${{ inputs.push && ' and push' || '' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.version || 'dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
